# push 마다 자동: 백엔드 테스트 · 프론트 타입 검사/빌드/린트.
# main 에 push 되면 백엔드 arm64 이미지(t4g)를 만들어 GHCR 에 올림 (서버 반영은 Deploy 버튼으로 따로)
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: 테스트
        working-directory: backend
        run: ./gradlew --no-daemon test
      - name: 실패한 테스트 보고서
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: 프론트 빌드·린트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  image:
    name: 백엔드 이미지 (arm64 → GHCR)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 공개 저장소라 ARM 러너에서 바로 arm64 로 빌드 (에뮬레이션 없음)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 태그 정하기
        id: tag
        run: |
          echo "short=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sumbi-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.short }}
            ${{ steps.tag.outputs.image }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 배포할 태그
        run: echo "### 이미지 ${{ steps.tag.outputs.short }} 준비됨 → Actions › Deploy 에서 이 태그로 배포" >> "$GITHUB_STEP_SUMMARY"
