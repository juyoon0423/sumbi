# 서버 반영 버튼: Actions › Deploy › Run workflow. 태그를 비우면 이 브랜치(main) 마지막 커밋 이미지.
# 되돌리기: 이전 태그(sha-xxxxxxx)를 넣고 다시 실행.
# GitHub → AWS 는 OIDC(키 없이 임시 권한) → SSM 으로 서버에서 deploy/deploy.sh 실행 (SSH·22번 포트 없음)
name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "이미지 태그 (예: sha-1a2b3c4). 비우면 main 마지막 커밋"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read
  packages: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 서버에 배포
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 태그 정하기
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-sha-${GITHUB_SHA::7}}"
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "태그 형식이 이상해요: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 이미지가 있는지 확인
        run: docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sumbi-backend:${{ steps.tag.outputs.tag }}" > /dev/null
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: 서버에서 deploy.sh 실행 (SSM)
        env:
          INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          CMD="cd /opt/sumbi && sudo -u ubuntu git pull --ff-only -q && sudo -u ubuntu ./deploy/deploy.sh $TAG"
          ID=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "sumbi deploy $TAG" --timeout-seconds 600 \
            --parameters "$(jq -cn --arg c "$CMD" '{commands: [$c]}')" \
            --query Command.CommandId --output text)
          echo "SSM 명령 $ID"
          for _ in $(seq 1 120); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" --query StandardErrorContent --output text | tail -30
          echo "### $TAG 배포: $STATUS" >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = "Success" ]
