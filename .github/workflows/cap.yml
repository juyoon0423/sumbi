# 동시접속 상한 바꾸기 버튼 (휴대폰 GitHub 앱/웹에서도): Actions › Capacity › Run workflow
# 서버를 끄지 않고 5초 안에 반영. off = 기본값(SUMBI_MAX_TOTAL)으로, 빈칸 = 지금 값만 보기
name: Capacity

on:
  workflow_dispatch:
    inputs:
      max:
        description: "동시접속 상한 (숫자 0~5000 / off / 빈칸=보기만)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  cap:
    name: 상한 바꾸기
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 값 확인
        env:
          MAX: ${{ inputs.max }}
        run: '[[ -z "$MAX" || "$MAX" == off || "$MAX" =~ ^[0-9]{1,4}$ ]] || { echo "숫자 또는 off"; exit 1; }'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: 서버에서 cap.sh 실행 (SSM)
        env:
          INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
          MAX: ${{ inputs.max }}
        run: |
          CMD="cd /opt/sumbi && sudo -u ubuntu ./deploy/cap.sh $MAX"
          ID=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "sumbi cap $MAX" --parameters "$(jq -cn --arg c "$CMD" '{commands: [$c]}')" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$ID" --instance-id "$INSTANCE" || true
          OUT=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" --query StandardOutputContent --output text)
          echo "$OUT"
          { echo '```'; echo "$OUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
