server:
  port: ${PORT:8080}

spring:
  application:
    name: sumbi-backend
  main:
    banner-mode: off
  data:
    redis:
      # 예: redis://localhost:6379, 비밀번호가 있으면 redis://:<비밀번호>@host:6379 (환경변수로만 넣을 것)
      url: ${SUMBI_REDIS_URL:redis://localhost:6379}
      # Redis 가 멈춰도 접속 처리가 오래 기다리지 않게 짧게
      timeout: 500ms
      connect-timeout: 500ms
      # Redis 저장소(Spring Data Repository)는 쓰지 않음
      repositories:
        enabled: false

sumbi:
  # 쉼표로 여러 개. 배포 때는 SUMBI_ALLOWED_ORIGINS 환경변수로 실제 프론트 주소를 넣는다
  allowed-origins: ${SUMBI_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  room-capacity: ${SUMBI_ROOM_CAPACITY:50}
  max-total: ${SUMBI_MAX_TOTAL:500}
  tick-ms: 100
  heartbeat-timeout-ms: ${SUMBI_HEARTBEAT_TIMEOUT_MS:30000}
  reconnect-grace-ms: ${SUMBI_RECONNECT_GRACE_MS:20000}
  max-messages-per-sec: 30
  max-message-bytes: 1024
  # 느린 연결 정리: 전송 하나가 이 시간보다 오래 걸리거나, 못 보낸 메시지가 이만큼 쌓이면 끊음
  send-time-limit-ms: ${SUMBI_SEND_TIME_LIMIT_MS:3000}
  send-buffer-bytes: ${SUMBI_SEND_BUFFER_BYTES:262144}
  today-interval-ms: 5000
  # 오늘의 바다 저장소: auto(Redis 있으면 Redis, 없으면 메모리) | redis(꼭 Redis) | memory
  stats-store: ${SUMBI_STATS_STORE:auto}
  look-interval-ms: 2000
  harvest-interval-ms: 1000
  bulteok:
    prep-ms: 3000        # 프론트 손질 모션 길이와 같게 (config.ts prepDuration)
    rest-ms: 4000        # 귤 까먹기
    basin-capacity: ${SUMBI_BASIN_CAPACITY:20}   # 첫 대야. 비울 때마다 불턱 인원 × 4 (12~40)
    basin-celebrate-ms: 4000
  sea:
    center-x: 0
    center-z: 8
    radius: 55
    min-y: -40
    max-y: 2
    # 프론트 최고 속도(약 2.4m/s)보다 넉넉히. 이보다 빠른 이동은 잘라냄
    max-speed: 5
    slack: 1.0

logging:
  level:
    com.sumbi: INFO
