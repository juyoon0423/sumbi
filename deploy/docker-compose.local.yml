# 로컬 확인용: 운영 구성(docker-compose.yml) 위에 덮어씀. TLS·Cloudflare 없이 http://localhost:8090
#   ./local.sh up      이미지 빌드 + 띄우기
#   ./local.sh switch  blue ↔ green 바꿔 배포 (무중단 확인)
#   ./local.sh down
services:
  nginx:
    ports: !override
      - "8090:80"
    volumes: !override
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx:/etc/nginx/sumbi:ro
      - ./data/nginx:/etc/nginx/sumbi-active:ro

  backend-blue: &local-backend
    environment:
      SUMBI_REDIS_URL: redis://redis:6379
      SUMBI_ALLOWED_ORIGINS: "http://localhost:*,http://127.0.0.1:*"
      SUMBI_MAX_TOTAL: "20"
      SUMBI_SLOT_OFFER_MS: ${SUMBI_SLOT_OFFER_MS:-45000}

  backend-green: *local-backend

  redis:
    # 로컬은 따로 저장하지 않음
    command: !override ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes: !reset []
    # 캡처 스크립트에서 상한을 바꾸려고 (redis-cli -p 6390)
    ports:
      - "127.0.0.1:6390:6379"
