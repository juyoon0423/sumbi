# http 영역 공통 설정 (conf.d 에 들어가므로 http { } 안에서 읽힘)
limit_conn_zone $binary_remote_addr zone=sumbi_conn_per_ip:10m;
# 새 연결 시도: IP 당 초당 5번 (재접속 폭주·봇 막기)
limit_req_zone $binary_remote_addr zone=sumbi_ws_per_ip:10m rate=5r/s;
limit_conn_status 429;
limit_req_status 429;
server_tokens off;

# 지금 쓰는 색(blue/green): deploy.sh 가 data/nginx/upstream.conf 를 바꾸고 nginx 를 reload
include /etc/nginx/sumbi-active/upstream.conf;
