# 운영·로컬 공통: 백엔드로 가는 길 (프론트는 Vercel 이 따로 서비스)

# 게임 연결 (WebSocket)
location = /ws {
    # 한 IP 에서 동시에 여는 연결 수 제한 (탭 여러 개는 허용)
    limit_conn sumbi_conn_per_ip 8;
    limit_req zone=sumbi_ws_per_ip burst=20 nodelay;

    proxy_pass http://sumbi_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # 서버 하트비트(30초)보다 넉넉히. 이 시간 동안 아무 메시지도 없으면 끊음
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
}

# 살아 있는지 확인 (배포 스크립트·UptimeRobot)
location = /health {
    proxy_pass http://sumbi_backend;
    proxy_set_header Host $host;
    access_log off;
}

location / {
    return 404;
}
