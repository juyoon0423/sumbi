include /etc/nginx/sumbi/http-common.conf;
include /etc/nginx/sumbi/cloudflare-real-ip.conf;

# 443 만 열림 (보안 그룹: Cloudflare IP 만). 인증서는 Cloudflare Origin 인증서 (data/certs/, 저장소에 넣지 않음)
server {
    listen 443 ssl default_server;
    http2 on;
    # 도메인이 정해지면 바꿔도 되고, 그대로 두어도 동작함 (서버 하나에 사이트 하나)
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/sumbi/sumbi-locations.conf;
}
